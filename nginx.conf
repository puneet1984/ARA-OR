error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    server {
        listen 3000;
        server_name localhost;

        # 1. Main Landing Page & Status API -> Express App
        location / {
            proxy_pass http://127.0.0.1:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. OpenAI Inference Routing API -> OmniRoute API Plane
        location /v1/ {
            proxy_pass http://127.0.0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for streaming LLM text tokens (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 3. Frontend Web Dashboard UI -> OmniRoute Dashboard Plane
        location /dashboard {
            proxy_pass http://127.0.0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Tell Next.js we are behind a secure SSL terminator to break the 301 redirect loop
            proxy_set_header X-Forwarded-Port 443;
        }

        # 4. Next.js Static Hydration Assets & Core Framework Scripts
        location /_next/ {
            proxy_pass http://127.0.0;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Critical WebSocket parameters for live dashboard stats streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 5. OAuth Authentication Callbacks
        location /callback {
            proxy_pass http://127.0.0;
            proxy_set_header Host $host;
        }
    }
}
