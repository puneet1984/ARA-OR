error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    include /etc/nginx/mime.types;

    upstream express_backend {
        server 127.0.0.1:4000;
    }

    upstream omniroute_api {
        server 127.0.0.1:20128;
    }

    upstream omniroute_dashboard {
        server 127.0.0.1:20129;
    }

    server {
        listen 3000;
        server_name localhost;

        # 1. Main Landing Page & Status API -> Express App
        location / {
            proxy_pass http://express_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. OpenAI Inference Routing API -> OmniRoute API Plane
        location /v1/ {
            proxy_pass http://omniroute_api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 3. Frontend Web Dashboard UI -> Direct Route Mapping
        location /dashboard/ {
            proxy_pass http://omniroute_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 443;

            # 🚀 CRITICAL WS HEADERS FOR ROOT UPGRADE PASSING 🚀
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # 4. Next.js Static Hydration Assets & Core Framework Scripts
        location /_next/ {
            proxy_pass http://omniroute_dashboard/_next/;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # 🚀 HARDENED STREAM UPGRADES FOR SECURE CLOUD DESCRIPTORS 🚀
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # 5. OAuth Authentication Callbacks
        location /callback {
            proxy_pass http://omniroute_dashboard/callback;
            proxy_set_header Host $host;
        }
    }
}
